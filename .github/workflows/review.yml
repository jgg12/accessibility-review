name: Accessibility review
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public sites.psu.edu URL (https://...)
        required: true
        type: string
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: accessibility-review
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'accessibility-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine URL
        id: input
        env:
          INPUT_URL: ${{ inputs.site_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const body = process.env.ISSUE_BODY || '';
          const match = body.match(/https:\/\/[^\s<>"']+/);
          const raw = process.env.INPUT_URL || match?.[0] || '';
          let url;
          try { url = new URL(raw.trim()); } catch { throw new Error('A valid HTTPS URL is required'); }
          if (url.protocol !== 'https:' || url.username || url.password || url.port || !(url.hostname === 'sites.psu.edu' || url.hostname.endsWith('.sites.psu.edu'))) throw new Error('Only public sites.psu.edu HTTPS URLs are supported');
          fs.appendFileSync(process.env.GITHUB_ENV, `SITE_URL=${url.toString()}\n`);
          EOF
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run accessibility scan
        env:
          MAX_PAGES: '25'
        run: npm run scan
      - name: Commit updated reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/report.json docs/report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update accessibility review report"
            git push
          fi
      - name: Add report link to issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Review complete. Open the [dashboard](https://${REPO%%/*}.github.io/${REPO##*/}/) and download the CSV report. The dashboard shows the most recently completed review."
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"
